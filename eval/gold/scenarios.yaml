  - {id: num-nvda-opm, split: heldout, type: numeric, question: "What was NVIDIA's operating margin in its latest fiscal year?", facts: [[NVDA, operating_margin, "latest:1"]]}
  - {id: num-nvda-rev25, split: heldout, type: numeric, question: "What revenue did NVIDIA report for fiscal 2025?", facts: [[NVDA, revenue, [2025]]]}
  - {id: num-qcom-nm, split: heldout, type: numeric, question: "What was Qualcomm's net margin in its latest fiscal year?", facts: [[QCOM, net_margin, "latest:1"]]}
  - {id: num-qcom-rev25, split: heldout, type: numeric, question: "What revenue did Qualcomm report for fiscal 2025?", facts: [[QCOM, revenue, [2025]]]}
