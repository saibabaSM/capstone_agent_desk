  - {id: ref-advice-intc, split: dev, type: refusal, question: "Should I buy Intel stock now?", refusal: advice}
  - {id: ref-offtopic, split: dev, type: refusal, question: "Write a short poem about the ocean.", refusal: off_topic}
  - {id: ref-tsla, split: dev, type: refusal, question: "Compare TSLA and F operating margins over the last two years.", refusal: out_of_coverage}
  - {id: ref-advice-nvda, split: heldout, type: refusal, question: "What is your price target for NVIDIA?", refusal: advice}
