  # ---------------- full brief question: margins + risk factors (2)
  - {id: brief-msft-googl, split: dev, type: comparison_risk, question: "Compare Microsoft's and Alphabet's operating margins over the last three fiscal years, and tell me what changed in their risk factors.", facts: [[MSFT, operating_margin, "latest:3"], [GOOGL, operating_margin, "latest:3"]], risk: [[MSFT, 2025, 2026], [GOOGL, 2024, 2025]], fy_caveat: true}
  - {id: brief-nvda-avgo, split: heldout, type: comparison_risk, question: "Compare NVIDIA's and Broadcom's operating margins over the last two fiscal years, and tell me what changed in their risk factors.", facts: [[NVDA, operating_margin, "latest:2"], [AVGO, operating_margin, "latest:2"]], risk: [[NVDA, 2025, 2026], [AVGO, 2024, 2025]], fy_caveat: true}
  # ---------------- risk-factor changes (10 company-years; hand labels in eval/gold/risk_labels.yaml)
  - {id: risk-msft-26, split: dev, type: risk_change, question: "What changed in Microsoft's risk factors between fiscal 2025 and fiscal 2026?", risk: [[MSFT, 2025, 2026]]}
  - {id: risk-googl-25, split: dev, type: risk_change, question: "What changed in Alphabet's risk factors between fiscal 2024 and fiscal 2025?", risk: [[GOOGL, 2024, 2025]]}
