  - {id: num-aapl-rev25, split: heldout, type: numeric, question: "What revenue did Apple report for fiscal 2025?", facts: [[AAPL, revenue, [2025]]]}
  - {id: num-meta-opm, split: heldout, type: numeric, question: "What was Meta's operating margin in its latest fiscal year?", facts: [[META, operating_margin, "latest:1"]]}
  - {id: num-meta-ni24, split: heldout, type: numeric, question: "What net income did Meta report for fiscal 2024?", facts: [[META, net_income, [2024]]]}
  - {id: num-orcl-opm, split: heldout, type: numeric, question: "What was Oracle's operating margin in its latest fiscal year?", facts: [[ORCL, operating_margin, "latest:1"]]}
  - {id: num-orcl-rev25, split: heldout, type: numeric, question: "What revenue did Oracle report for fiscal 2025?", facts: [[ORCL, revenue, [2025]]]}
