  - {id: nar-nvda-26, split: heldout, type: narrative, question: "According to NVIDIA's fiscal 2026 10-K MD&A, what drove the change in revenue?", cite: [NVDA, 2026, "7"]}
  - {id: nar-aapl-26, split: heldout, type: narrative, question: "According to Apple's fiscal 2026 10-K MD&A, what drove the change in net sales?", cite: [AAPL, 2026, "7"]}
  - {id: nar-meta-25, split: heldout, type: narrative, question: "According to Meta's fiscal 2025 10-K MD&A, what drove the change in costs and expenses?", cite: [META, 2025, "7"]}
  # ---------------- memory: a first note is published, then "what changed since our last note?" (4)
  - {id: mem-msft, split: dev, type: memory, setup_question: "What were Microsoft's operating margins in fiscal 2024 and fiscal 2025?", question: "What changed since our last note on Microsoft's operating margin? Use the last three fiscal years.", facts: [[MSFT, operating_margin, "latest:3"]], new_year: [MSFT, "latest:1"]}
  - {id: mem-aapl, split: heldout, type: memory, setup_question: "What were Apple's operating margins in fiscal 2024 and fiscal 2025?", question: "What changed since our last note on Apple's operating margin? Use the last three fiscal years.", facts: [[AAPL, operating_margin, "latest:3"]], new_year: [AAPL, "latest:1"]}
  - {id: mem-orcl, split: heldout, type: memory, setup_question: "What were Oracle's operating margins in fiscal 2024 and fiscal 2025?", question: "What changed since our last note on Oracle's operating margin? Use the last three fiscal years.", facts: [[ORCL, operating_margin, "latest:3"]], new_year: [ORCL, "latest:1"]}
