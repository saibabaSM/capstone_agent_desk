  # ---------------- replanning: the plan asks for a year that does not exist (3)
  - {id: replan-googl-26, split: dev, type: replan, question: "What was Alphabet's operating margin in fiscal 2026?", final_years: {GOOGL: [2025]}, facts: [[GOOGL, operating_margin, [2025]]]}
