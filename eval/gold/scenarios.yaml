  - {id: risk-aapl-26, split: heldout, type: risk_change, question: "What changed in Apple's risk factors between fiscal 2025 and fiscal 2026?", risk: [[AAPL, 2025, 2026]]}
  - {id: risk-meta-25, split: heldout, type: risk_change, question: "What changed in Meta's risk factors between fiscal 2024 and fiscal 2025?", risk: [[META, 2024, 2025]]}
  - {id: risk-orcl-26, split: heldout, type: risk_change, question: "What changed in Oracle's risk factors between fiscal 2025 and fiscal 2026?", risk: [[ORCL, 2025, 2026]]}
  - {id: risk-nvda-26, split: heldout, type: risk_change, question: "What changed in NVIDIA's risk factors between fiscal 2025 and fiscal 2026?", risk: [[NVDA, 2025, 2026]]}
  - {id: risk-adbe-25, split: heldout, type: risk_change, question: "What changed in Adobe's risk factors between fiscal 2024 and fiscal 2025?", risk: [[ADBE, 2024, 2025]]}
  - {id: risk-qcom-26, split: heldout, type: risk_change, question: "What changed in Qualcomm's risk factors between fiscal 2025 and fiscal 2026?", risk: [[QCOM, 2025, 2026]]}
  - {id: risk-txn-25, split: heldout, type: risk_change, question: "What changed in Texas Instruments' risk factors between fiscal 2024 and fiscal 2025?", risk: [[TXN, 2024, 2025]]}
