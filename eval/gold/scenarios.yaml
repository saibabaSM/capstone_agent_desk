  - {id: cmp-qcom-txn-nm, split: heldout, type: comparison, question: "Compare Qualcomm's and Texas Instruments' net margins over the last two fiscal years.", facts: [[QCOM, net_margin, "latest:2"], [TXN, net_margin, "latest:2"]], fy_caveat: true}
  - {id: cmp-nvda-qcom-growth, split: heldout, type: comparison, question: "Compare NVIDIA's and Qualcomm's revenue growth over the last two fiscal years.", facts: [[NVDA, revenue_growth, "latest:2"], [QCOM, revenue_growth, "latest:2"]], fy_caveat: true}
  - {id: cmp-adbe-orcl-growth, split: heldout, type: comparison, question: "Compare Adobe's and Oracle's revenue growth over the last two fiscal years.", facts: [[ADBE, revenue_growth, "latest:2"], [ORCL, revenue_growth, "latest:2"]], fy_caveat: true}
  - {id: cmp-aapl-nvda-rd, split: heldout, type: comparison, question: "Compare Apple's and NVIDIA's R&D intensity over the last two fiscal years.", facts: [[AAPL, rd_intensity, "latest:2"], [NVDA, rd_intensity, "latest:2"]], fy_caveat: true}
