# Golden-set scenarios, written by the evaluation owner BEFORE any agent run.
# `python -m agent_desk eval build-gold` turns these into eval/dev/cases.jsonl and
# eval/heldout/cases.jsonl, filling expected values from SEC companyconcept (see evaluation/gold.py).
# Split rule: related variants stay together. Dev companies: MSFT, GOOGL, AMD, INTC.
# Held-out companies: AAPL, META, ORCL, ADBE, NVDA, QCOM, TXN, AVGO. Refusals are split by kind.
# years: "latest:N" = the company's latest N fiscal years in gold; or an explicit list.
scenarios:
  # ---------------- numeric (24)
  - {id: num-msft-opm, split: dev, type: numeric, question: "What was Microsoft's operating margin in its latest fiscal year?", facts: [[MSFT, operating_margin, "latest:1"]]}
  - {id: num-msft-rev25, split: dev, type: numeric, question: "What revenue did Microsoft report for fiscal 2025?", facts: [[MSFT, revenue, [2025]]]}
  - {id: num-googl-opm, split: dev, type: numeric, question: "What was Alphabet's operating margin in its latest fiscal year?", facts: [[GOOGL, operating_margin, "latest:1"]]}
