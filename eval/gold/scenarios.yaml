  - {id: cmp-amd-intc-rd, split: dev, type: comparison, question: "Compare AMD's and Intel's R&D intensity (R&D as a share of revenue) over the last two fiscal years.", facts: [[AMD, rd_intensity, "latest:2"], [INTC, rd_intensity, "latest:2"]]}
