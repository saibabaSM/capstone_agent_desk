# docker compose up --build   -> UI http://localhost:8000 · Grafana http://localhost:3000 · Prometheus http://localhost:9090
# First run: the `init` service downloads EDGAR data and builds the index into the shared volume.
x-app: &app
  build: .
  image: analyst-desk:latest
  env_file: [.env]
  environment:
    AGENT_DESK_DATA: /data
    QDRANT_URL: http://qdrant:6333
  volumes: [desk-data:/data]

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: [qdrant-data:/qdrant/storage]
    networks: [backend]

  init:
    <<: *app
    command: ["sh", "-c", "python -m agent_desk sync-data && python -m agent_desk ingest --both"]
    depends_on: [qdrant]
    networks: [backend, egress]
    restart: "no"

  filings-kb:
    <<: *app
    command: ["python", "-m", "agent_desk", "mcp", "filings_kb", "--http", "8101"]
    depends_on:
      init: {condition: service_completed_successfully}
    networks: [backend]

  edgar:
    <<: *app
    command: ["python", "-m", "agent_desk", "mcp", "edgar", "--http", "8102"]
    depends_on:
      init: {condition: service_completed_successfully}
    networks: [backend, egress]   # may refresh Company Facts from data.sec.gov on a cache miss

  python-sandbox:
    <<: *app
    command: ["python", "-m", "agent_desk", "mcp", "python_sandbox", "--http", "8103"]
    networks: [sandbox]           # internal-only network: no route to the internet
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 64

  research-portal:
    <<: *app
    command: ["python", "-m", "agent_desk", "mcp", "research_portal", "--http", "8104"]
    environment:
      AGENT_DESK_DATA: /portal
      PORTAL_DB: /portal/portal.db
    volumes: [portal-data:/portal]  # the external system keeps its own database
    networks: [backend]

  app:
    <<: *app
    environment:
      AGENT_DESK_DATA: /data
      QDRANT_URL: http://qdrant:6333
      MCP_TRANSPORT: http
      MCP_FILINGS_KB_URL: http://filings-kb:8101/mcp
      MCP_EDGAR_URL: http://edgar:8102/mcp
      MCP_PYTHON_SANDBOX_URL: http://python-sandbox:8103/mcp
      MCP_RESEARCH_PORTAL_URL: http://research-portal:8104/mcp
    ports: ["8000:8000"]
    depends_on: [filings-kb, edgar, python-sandbox, research-portal]
    networks: [backend, sandbox, egress]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [backend]

networks:
  backend: {}
  egress: {}
  sandbox: {internal: true}

volumes:
  desk-data: {}
  qdrant-data: {}
  portal-data: {}
