name: ci
on: [push, pull_request]
jobs:
  test-and-eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      AGENT_DESK_LLM_MODE: offline           # deterministic; the live run below is optional
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.*
          pip install -r requirements.txt
      - name: Unit tests (one per MCP tool, numbers, approval, hooks, guardrails, graph)
        run: python -m pytest -q
      - name: Cache EDGAR data and index
        uses: actions/cache@v4
        with: {path: data, key: "edgar-${{ hashFiles('src/agent_desk/companies.py', 'src/agent_desk/rag/**') }}"}
      - name: Data + index (cached after the first run)
        run: |
          test -d data/index/table || (python -m agent_desk sync-data && python -m agent_desk ingest --both)
      - name: Eval gate (dev split, offline mode) - fails below threshold
        run: |
          python -m agent_desk eval run --split dev --experiment configs/experiments/ci_offline.yaml --concurrency 2 --label ci
          python -m agent_desk eval gate $(ls -t eval/results/ci_offline-ci-*.jsonl | head -1) --min-success 0.85 --min-verified 0.98
      - name: Live eval gate (only when the OPENROUTER_API_KEY secret exists)
        if: env.HAS_OPENROUTER == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_DESK_LLM_MODE: live
        run: |
          python -m agent_desk eval run --split dev --experiment configs/experiments/e1_c2_team.yaml --limit 8 --label ci-live
          python -m agent_desk eval gate $(ls -t eval/results/e1_c2_team-ci-live-*.jsonl | head -1) --min-success 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-results, path: eval/results/}
